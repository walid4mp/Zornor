name: zynora_mobile
description: ZYNORA Games mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  socket_io_client: ^3.0.2
  url_launcher: ^6.3.1
  google_mobile_ads: ^5.2.0
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  chess: ^0.8.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/brand/
