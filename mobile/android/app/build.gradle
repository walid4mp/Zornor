plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.zynora.games"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.zynora.games"
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystore = System.getenv("ZYNORA_KEYSTORE_PATH")
            def resolvedStoreFile = keystore ? file(keystore) : null
            if (resolvedStoreFile != null && resolvedStoreFile.exists()) {
                storeFile resolvedStoreFile
                storePassword System.getenv("ZYNORA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ZYNORA_KEY_ALIAS")
                keyPassword System.getenv("ZYNORA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = System.getenv("ZYNORA_KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
